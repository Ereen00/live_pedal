# =====================================================================
# live_pedal -- default rig: gesture-selected chords
#
# El hareketleri artik SADECE akor seciyor. Bir akor sectiginde,
# sen yeni bir hareket yapana kadar o akor secili kalir.
#
# Akor arkada surekli calmaz. Gitarda bir notaya bastiginda arkadan
# gelir, sen calmayi biraktiginda yavasca soner.
#
#   Acik el (5 parmak)   -> Em
#   Yumruk               -> E
#   Isaret parmagi       -> Fm
#   Iki parmak (peace)   -> B7b9
#
# Kontrol:   python run.py --dry-run     (kontrol et, donanima dokunma)
# Calistir:  run.bat
# =====================================================================

name: default

audio:
  samplerate: 48000
  blocksize: 256

  input_device: "USB AUDIO"
  output_device: "USB AUDIO"
  hostapi: auto
  wasapi_exclusive: true

  input_channel: 0
  input_gain_db: 0.0
  output_gain_db: -3.0
  output_limit: 0.99
  dry_monitor: 0.0
  latency: low

vision:
  camera_index: 0
  width: 640
  height: 480
  fps: 60
  exposure: -6
  hand: right
  mirror: true
  show_window: true

  # Poz secimi icin biraz daha yuksek yumusatma iyi: elin bir sekilden
  # digerine geciserken arada yanlis poz yakalanmasini azaltir.
  smoothing: 0.4
  model: models/hand_landmarker.task

# ---------------------------------------------------------------------
# SES ZINCIRI
#
# Buradaki degerler artik SABIT tondur -- istedigin "her zaman ayni
# efekt" karakteri bu. El hareketleri bunlara dokunmuyor, sadece akoru
# seciyor.
#
# Sira onemli: chordpad drive'dan SONRA geliyor, yani gitar distortion
# yiyor ama akor pad'i yemiyor. Bes sesli bir akoru distortion'a
# sokarsan camur olur.
# ---------------------------------------------------------------------
chain:

  # Gitar sinyalini temizle. Bu ayni zamanda pad'in tetiklenmesini de
  # temizler: parmak/tel gurultusu akoru tetiklemesin.
  - type: gate
    threshold_db: -55
    hold_ms: 80

  # Gitara hafif bir kenar. Techno icin cok sert olmasin diye 'soft'.
  - type: drive
    gain_db: 13
    tone: 0.5
    level: 0.5
    shape: soft

  # ---- AKOR PAD'I -------------------------------------------------
  # Nota calindiginda tetiklenir, sen susunca yavasca soner.
  - type: chordpad
    level: 0.40

    chords:
      - name: Em
        notes: [E2, B2, E3, G3,  B3]
      - name: E
        notes: [E2, B2, E3, G#3, B3]
      - name: Fm
        notes: [F2, C3, F3, Ab3, C4]
      - name: B7b9
        notes: [B2, D#3, F#3, A3, C4]

    # Zarf. release_ms senin "birden kesilmesin, yavasca kesilsin"
    # istegin -- 2.2 saniyede tamamen soner.
    attack_ms: 60          # ani girmesin, hafifce sisip gelsin
    decay_ms: 500
    sustain: 0.80
    release_ms: 2200

    # Tetikleme. threshold_db'yi yukselt (-30) = daha zor tetiklenir,
    # dusur (-40) = daha hassas. retrigger_ms iki tetikleme arasi
    # minimum sure: tek vurus iki kere tetiklemesin diye.
    threshold_db: -34
    sensitivity: 1.6
    retrigger_ms: 180
    hold_db: -46           # bunun altina dusunce "gitar sustu" sayilir

    # Ton: techno icin detune'lu supersaw, filtreli.
    wave: saw
    unison: 3
    detune: 12
    cutoff: 2400
    resonance: 1.4
    octave: 0

    # 1 = yeni akor, bir sonraki caldigin notada devreye girer.
    # Boylece calan bir pad'in altindan akor degismez.
    change_on_trigger: 1

  # ---- SABIT TON KARAKTERI ----------------------------------------
  # Buradan asagisi hem gitara hem akora ayni sekilde uygulanir.

  # Wah artik el hareketiyle degil, sabit bir renk olarak duruyor.
  # (Eskiden avuc acikligi bunu suruyordu; poz secimiyle cakisiyordu.)
  - type: wah
    freq: 900
    q: 2.5
    mix: 0.35

  - type: chorus
    rate: 0.4
    depth_ms: 3.5
    delay_ms: 20
    mix: 0.28

  - type: delay
    time_ms: 300           # ~100 BPM'de sekizlik
    feedback: 0.42
    mix: 0.26
    damping: 0.5

  - type: reverb
    size: 0.80
    damping: 0.45
    mix: 0.22
    predelay_ms: 20

  - type: volume
    gain: 1.0

# ---------------------------------------------------------------------
# EL HAREKETLERI
#
# mode: latch  -> hareketi yapinca deger bir kez yazilir ve orada kalir.
# Elini indirsen de akor degismez; ancak baska bir poz yapinca degisir.
#
# Baska pozlar da var: pose_ok (bas+isaret halka), pose_thumbup.
# Bir pozu begenmezsen source satirini degistirmen yeterli.
# ---------------------------------------------------------------------
mappings:

  # Acik el (bes parmak acik)  -> Em
  - source: pose_open
    target: chordpad.chord
    hi: 0
    mode: latch

  # Yumruk  -> E
  - source: pose_fist
    target: chordpad.chord
    hi: 1
    mode: latch

  # Isaret parmagi yukari  -> Fm
  - source: pose_point
    target: chordpad.chord
    hi: 2
    mode: latch

  # Iki parmak (peace)  -> B7b9
  - source: pose_peace
    target: chordpad.chord
    hi: 3
    mode: latch
