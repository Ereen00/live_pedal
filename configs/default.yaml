# =====================================================================
# live_pedal -- default rig: 8-bit gitar + el hareketiyle secilen akor
#
# GITAR TONU: tamamen kuru. Reverb yok, delay yok, hicbir uzamsal
# efekt yok. Tek efekt var: chiptune (square/pulse + bitcrusher +
# downsampler + kisa pluck zarfi).
#
# AKOR: arkada surekli calmaz. Bir notaya bastiginda gelir, sen
# susunca o da suser (follow). El hareketi hangi akor oldugunu secer
# ve sen yeni bir hareket yapana kadar o akor secili kalir.
#
#   Acik el (3-5 parmak)  -> Em
#   Yumruk                -> E
#   Isaret parmagi        -> Fm
#   Iki parmak (peace)    -> B7b9
#
# Kamera penceresinde secili akorun adi buyuk harflerle yazar.
# Degismiyorsa once oraya bak: hareket algilanmiyor demektir.
#
# Kontrol:   python run.py --dry-run     (kontrol et, donanima dokunma)
# Calistir:  run.bat
# =====================================================================

name: default

audio:
  samplerate: 48000
  blocksize: 256

  input_device: "USB AUDIO"
  output_device: "USB AUDIO"
  hostapi: auto
  wasapi_exclusive: true

  input_channel: 0
  input_gain_db: 0.0
  output_gain_db: -3.0
  output_limit: 0.99
  dry_monitor: 0.0
  latency: low

vision:
  camera_index: 0
  width: 640
  height: 480
  fps: 60
  exposure: -6

  # 'any' = hangi el gorunuyorsa onu kullanir. 'right'/'left' yaparsan
  # MediaPipe o eli bulamazsa hicbir hareket calismaz -- akorlarin hic
  # degismemesinin en sik sebebi budur.
  hand: right
  mirror: true
  show_window: true

  # Poz secimi icin biraz daha yuksek yumusatma iyi: elin bir sekilden
  # digerine geciserken arada yanlis poz yakalanmasini azaltir.
  smoothing: 0.4
  model: models/hand_landmarker.task

# ---------------------------------------------------------------------
# SES ZINCIRI
#
# Sadece uc sey var: kapi, chiptune, akor. Bilerek bu kadar az.
# ---------------------------------------------------------------------
chain:

  # Gitar sinyalini temizle. Bu ayni zamanda hem chiptune'un hem de
  # akorun tetiklenmesini temizler: parmak/tel gurultusu tetiklemesin.
  - type: gate
    threshold_db: -55
    hold_ms: 80

  # ---- TEK GITAR EFEKTI: 8-BIT ------------------------------------
  # Notalarin uzerinde duyacagin sey bu. Tamamen kuru.
  - type: chiptune

    # square: 0 = gitarin kendi dalgasi, 1 = saf pulse wave.
    # 0.85 gitarin tirnak/tel karakterinden biraz birakiyor.
    square: 0.85
    pulse_width: 0.5       # 0.5 = kare. 0.25 veya 0.75 = daha ince, genizden

    # Cozunurluk dusurme. Asil "eski oyun" sesi burada.
    bits: 4                # bit derinligi: 3 = cok kaba, 8 = temiz
    crush_hz: 6000         # ornekleme hizi: dusurdukce daha cok aliasing

    tone: 7000             # en tiz aliasing'i biraz kessin diye

    # Kisa pluck zarfi: nota vurulur ve biter, uzamaz.
    pluck: 0.7             # 0 = kapali, 1 = tamamen sustain'siz
    decay_ms: 400          # kisalt = daha staccato, uzat = daha akici
    attack_ms: 3

    # Neyin "yeni nota" sayildigi.
    threshold_db: -40
    sensitivity: 1.10
    retrigger_ms: 80

    level: 1.0
    mix: 1.0               # 1.0 = tamamen 8-bit, dusurursen temiz gitar karisir

  # ---- AKOR PAD'I -------------------------------------------------
  # Nota calindiginda tetiklenir, sen susunca soner.
  # (Akorlarin efektini sonra soyleyeceksin; simdilik sade.)
  - type: chordpad
    level: 0.22            # gitardan yuksek olmasin diye dusuk

    chords:
      - name: Em
        notes: [E2, B2, E3, G3,  B3]
      - name: E
        notes: [E2, B2, E3, G#3, B3]
      - name: Fm
        notes: [F2, C3, F3, Ab3, C4]
      - name: B7b9
        notes: [B2, D#3, F#3, A3, C4]

    # follow = akorun sesi gitarin sesini takip eder. 0.85'te akor
    # notanin golgesi gibi davranir: nota susunca akor da suser.
    # Dusurursen akorun kendi kuyrugu olur (release_ms kadar surer).
    follow: 0.85
    follow_db: -14

    attack_ms: 35
    decay_ms: 250
    sustain: 0.75
    release_ms: 500        # follow ile birlikte ~yarim saniyede biter

    threshold_db: -34
    sensitivity: 1.10
    retrigger_ms: 180
    hold_db: -40

    # Ton: 8-bit temaya uysun diye kare dalga, tek ses, filtreli.
    wave: square
    unison: 1
    detune: 0
    cutoff: 3000
    resonance: 0.9
    octave: 0

    # 0 = el hareketini yapar yapmaz akor degisir. Ogrenirken bu lazim:
    # calmadan da degistigini duyabilirsin. 1 yaparsan yeni akor bir
    # sonraki caldigin notada devreye girer.
    change_on_trigger: 0

  - type: volume
    gain: 1.0

# ---------------------------------------------------------------------
# EL HAREKETLERI
#
# mode: latch  -> hareketi yapinca deger bir kez yazilir ve orada kalir.
# Elini indirsen de akor degismez; ancak baska bir poz yapinca degisir.
#
# Pozlar birbirini disliyor: ayni anda ikisi birden algilanmaz.
#   pose_fist     yumruk, basparmak da kapali
#   pose_thumbup  yumruk ama basparmak yukarida
#   pose_point    sadece isaret parmagi
#   pose_peace    isaret + orta
#   pose_open     isaret dahil en az uc parmak acik
#   pose_ok       basparmak ve isaret halka, digerleri acik
# ---------------------------------------------------------------------
mappings:

  # Acik el  -> Em
  - source: pose_open
    target: chordpad.chord
    hi: 0
    mode: latch

  # Yumruk  -> E
  - source: pose_fist
    target: chordpad.chord
    hi: 1
    mode: latch

  # Isaret parmagi yukari  -> Fm
  - source: pose_point
    target: chordpad.chord
    hi: 2
    mode: latch

  # Iki parmak (peace)  -> B7b9
  - source: pose_peace
    target: chordpad.chord
    hi: 3
    mode: latch
